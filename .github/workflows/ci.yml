name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # On macOS this also compiles both native helpers and runs the stdio subprocess test.
      - run: uv run pytest --cov --cov-report=term-missing

  floors:
    # The declared lower bounds, not just the lock file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - run: uv run --resolution lowest-direct pytest

  fixture-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh bench/fixture-app/build.sh

  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - name: Rebuild the wheel from the sdist
        run: uv build --wheel --out-dir dist-from-sdist dist/*.tar.gz
      - run: uvx twine@7.0.0 check --strict dist/*
      - name: Both wheels ship the native sources and py.typed
        run: uv run --no-project python scripts/check_wheel.py dist/*.whl dist-from-sdist/*.whl
      - name: Installed-package smoke test (sdist-derived wheel, outside the checkout)
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 v
          uv pip install --python v "$GITHUB_WORKSPACE"/dist-from-sdist/*.whl
          v/bin/cua-jev --version
          v/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
