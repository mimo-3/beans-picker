name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: The tag names the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-project python -c 'import re, pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/cua_jev/__init__.py").read_text()).group(1))')
          test "$TAG" = "v$version"
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ dist/*
      - name: Install the published wheel in a fresh environment
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          uv export --no-dev --no-emit-project --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/v"
          uv pip install --python "$RUNNER_TEMP/v" -r "$RUNNER_TEMP/requirements.txt"
          for attempt in 1 2 3 4 5 6; do
            uv pip install --python "$RUNNER_TEMP/v" --no-deps --no-cache --index-url https://test.pypi.org/simple/ "cua-jev==$version" && break
            sleep 20
          done
          "$RUNNER_TEMP/v/bin/cua-jev" --version
      - name: The installed wheel is the one built
        run: |
          expected=$(sha256sum dist/*.whl | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/wheel"
          cd "$RUNNER_TEMP/wheel"
          curl -fsSL -o cua_jev.whl "$(curl -fsSL "https://test.pypi.org/pypi/cua-jev/${GITHUB_REF_NAME#v}/json" | python3 -c 'import json, sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "bdist_wheel"))')"
          test "$(sha256sum cua_jev.whl | cut -d' ' -f1)" = "$expected"

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always dist/*
